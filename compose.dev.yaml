services:

  db:
    env_file:
      - .env.dev

    ports:
      - "5433:5432"


  redis:
    ports:
      - "6379:6379"


  backend:
    build:
      context: .
      dockerfile: docker/dev/backend/Dockerfile

    command: python manage.py runserver 0.0.0.0:8000

    env_file:
      - .env.dev

    volumes:
      - ./backend:/app

    ports:
      - "8000:8000"


  celery_worker:
    build:
      context: .
      dockerfile: docker/dev/backend/Dockerfile

    command: celery -A config worker --loglevel=info

    env_file:
      - .env.dev

    volumes:
      - ./backend:/app